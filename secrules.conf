# Règles WAF propres à TACCT.
#
# Coraza charge ce fichier APRÈS la CRS OWASP (voir le Caddyfile) :
# SecRuleRemoveById ne peut retirer qu'une règle déjà chargée.
#
# Règle ajoutée : lui donner un ID entre 1 et 99999 (plage réservée aux règles locales).
# Commentaires : toujours sur une ligne à part (pas de # en fin de directive).

# --- CRS en mode détection ---------------------------------------------------
# La règle 949110 bloque une requête quand son score d'anomalie atteint le
# seuil (5). Elle est retirée pour éviter les faux positifs : la CRS détecte
# les attaques et les inscrit dans les logs, sans les bloquer.
# Pour faire bloquer la CRS : supprimer cette ligne, après avoir traité les
# faux positifs visibles dans les logs (section suivante).
# https://github.com/corazawaf/coraza-coreruleset/blob/v4.25.0/rules/@owasp_crs/REQUEST-949-BLOCKING-EVALUATION.conf
SecRuleRemoveById 949110

# --- Faux positifs -----------------------------------------------------------
# Une entrée par règle CRS à désactiver, avec la raison au-dessus. Exemple :
#
# Champ "description" du formulaire X : texte libre pris pour du SQL.
# SecRuleRemoveById 942100
