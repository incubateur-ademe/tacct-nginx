# Réglages de la CRS propres à TACCT.
#
# Coraza charge ce fichier AVANT les règles de la CRS (voir le Caddyfile) : la CRS
# n'applique ses valeurs par défaut que pour les variables qui ne sont pas déjà
# définies ici.
# Les exclusions de règles (SecRuleRemoveById...) vont dans secrules.conf, chargé après.

# --- Types de contenu autorisés pour le corps des requêtes --------------------
# Valeur par défaut de la CRS 4.25, plus text/plain.
# Les Server Actions de Next.js (en-tête Next-Action) envoient leur corps en
# "text/plain;charset=UTF-8". Sans cet ajout, la règle 920420 les signale comme
# attaque critique (16 requêtes sur 867 mesurées le 09/11/2026) et les bloquerait.
SecAction \
    "id:900220,\
    phase:1,\
    pass,\
    t:none,\
    nolog,\
    setvar:'tx.allowed_request_content_type=|application/x-www-form-urlencoded| |multipart/form-data| |text/xml| |application/xml| |application/soap+xml| |application/json| |text/plain|'"
