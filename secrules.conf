# Règles WAF propres à TACCT.
#
# Coraza charge ce fichier APRÈS la CRS OWASP (voir le Caddyfile) :
# SecRuleRemoveById et SecRuleUpdateTarget... ne s'appliquent qu'à des règles déjà chargées.
# Les réglages de la CRS (variables tx.*) vont dans crs-setup.conf, chargé avant.
#
# Règle ajoutée : lui donner un ID entre 1 et 99999 (plage réservée aux règles locales).
# Commentaires : toujours sur une ligne à part (pas de # en fin de directive).

# --- Faux positifs -----------------------------------------------------------
# Une entrée par faux positif, avec la raison au-dessus.

# Cookie PostHog (ph_phc_<projet>_posthog) : JSON d'analytics qui contient des
# clés comme "$initial_person_info". La règle 942290 (injection MongoDB) y voit
# l'opérateur "$in" : 618 requêtes réelles sur 867 signalées le 09/11/2026.
# Ce cookie n'est utilisé que par PostHog : la CRS ne l'inspecte plus.
SecRuleUpdateTargetByTag OWASP_CRS "!REQUEST_COOKIES:/^ph_phc_/"

# --- Blocage par la CRS ------------------------------------------------------
# Actif depuis le 09/11/2026 : la règle 949110 bloque (403) toute requête dont le
# score d'anomalie atteint le seuil (5). Avant, elle était retirée (héritage de la
# configuration nginx) et la CRS ne faisait que journaliser.
# En cas de faux positifs massifs, pour repasser en détection seule le temps de
# les corriger, décommenter la ligne suivante puis redéployer :
# SecRuleRemoveById 949110
# https://github.com/corazawaf/coraza-coreruleset/blob/v4.25.0/rules/@owasp_crs/REQUEST-949-BLOCKING-EVALUATION.conf
